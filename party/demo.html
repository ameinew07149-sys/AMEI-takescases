/* ================================================================
   玩法六：手機燈海
   ================================================================ */
const LCOL = () => O().lightColors || ['#ffd36b','#ff8fa3','#7fd1ff','#9be38a','#c9a2ff','#ffffff'];
G.light = {
  init(){
    st={mode:'wave', color:LCOL()[0], msg:O().lightMsg, dots:[], my:{on:false, color:LCOL()[0]}, t0:performance.now()};
    const rows=7; for(let r=0;r<rows;r++){ const y=330+r*r*7.4+r*14, n=14+r*4, sz=3+r*1.3;
      for(let i=0;i<n;i++) st.dots.push({x:40+(1200/(n-1))*i+(Math.random()-.5)*30, y:y+(Math.random()-.5)*14, r:sz, ph:Math.random()*6.28, c:pick(LCOL()), on:false}); }
    st.dots.forEach(d=>{ if(Math.random()<.18) d.on=true; });
    st.myDot={x:640, y:655, r:13, c:st.my.color, on:false, me:true, ph:0};
    every(260, ()=>{ if(!S.sim) return; const off=st.dots.filter(d=>!d.on); if(off.length>st.dots.length*.08 && Math.random()<.8){ pick(off).on=true; this.cnt(); } });
  },
  lit(){ return st.dots.filter(d=>d.on).length+(st.my.on?1:0); },
  cnt(){ const n=$('#lt-n'); if(n) n.textContent=this.lit(); const c=$('#cl-n'); if(c) c.textContent=this.lit(); },
  colorAt(d, t){
    const m=st.mode;
    if(m==='rainbow') return {c:`hsl(${(d.x/3+t*80)%360} 90% 65%)`, b:.85};
    if(m==='sync') return {c:st.color, b:.45+.55*(.5+.5*Math.sin(t*3))};
    if(m==='wave') return {c:st.color, b:.2+.8*Math.max(0,Math.sin(t*2.6-d.x/95))};
    return {c:d.c, b:.6+.4*Math.sin(t*2+d.ph)};
  },
  frame(t){
    t=(t-st.t0)/1000;
    const cv=$('#lt-cv');
    if(cv){
      const x=cv.getContext('2d'); x.clearRect(0,0,1280,720);
      const all=st.my.on?[...st.dots, {...st.myDot, c:st.my.color}]:st.dots;
      if(O().network){ const on=all.filter(d=>d.on||d.me); x.lineWidth=1;
        for(let i=0;i<on.length;i++) for(let j=i+1;j<on.length;j++){ const a=on[i], b=on[j], dd=Math.hypot(a.x-b.x,a.y-b.y); if(dd<95){ x.strokeStyle=`rgba(90,209,255,${(.55*(1-dd/95)*(.6+.4*Math.sin(t*2+a.ph))).toFixed(3)})`; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); } } }
      all.forEach(d=>{
        if(!d.on && !d.me){ x.fillStyle='rgba(255,255,255,.06)'; x.beginPath(); x.arc(d.x,d.y,d.r*.6,0,7); x.fill(); return; }
        const {c,b}=this.colorAt(st.mode==='free'?d:d, t), R=d.r*(3.2+b*2.2);
        x.globalAlpha=b; const g=x.createRadialGradient(d.x,d.y,0,d.x,d.y,R); g.addColorStop(0,c); g.addColorStop(.25,c); g.addColorStop(1,'rgba(0,0,0,0)');
        x.fillStyle=g; x.beginPath(); x.arc(d.x,d.y,R,0,7); x.fill(); x.globalAlpha=1;
        if(d.me){ x.strokeStyle='#fff'; x.lineWidth=2; x.beginPath(); x.arc(d.x,d.y,d.r*2.2,0,7); x.stroke(); }
      });
    }
    const gl=$('#g-light');
    if(gl){ const {c,b}=this.colorAt({x:st.myDot.x, c:st.my.color, ph:0}, t); gl.style.background=c; gl.style.setProperty('--dim',(.62*(1-b)).toFixed(2)); }
  },
  wall(el){
    el.innerHTML=`<div class="lt-ov" style="inset:-124px -44px -30px;position:absolute"><canvas id="lt-cv" width="1280" height="720"></canvas>
      <div class="lt-msg">${esc(st.msg)}</div><div class="lt-n">已點亮 <b id="lt-n">${this.lit()}</b> 支手機</div>
      <div class="lt-join"><img src="${qrImg()}" alt=""><span>掃描加入燈海</span></div></div>`;
    hostbar();
  },
  host(){ return ['wave','sync','rainbow','free'].map(m=>`<button class="hb" data-act="m-${m}" style="${st.mode===m?'background:var(--accent)':''}">${({wave:'人浪',sync:'同步',rainbow:'彩虹',free:'自由色'})[m]}</button>`).join(''); },
  guest(){
    const g=$('#guest');
    if(st.my.on){
      g.innerHTML=`<div class="g-light" id="g-light"><div class="gl-big">高舉手機！</div><p style="margin:0">${esc(st.msg)}</p>
        <div class="row" style="justify-content:center"><button type="button" class="btn small ghost" id="l-fs" style="color:#fff;border-color:#fff">全螢幕</button><button type="button" class="btn small ghost" id="l-off" style="color:#fff;border-color:#fff">熄燈</button></div>
        <p style="font-size:12px;opacity:.8;margin:0">${st.mode==='free'?'自由色：每個人用自己的顏色':'顏色由主持人統一控制'}</p></div>`;
      $('#l-fs').onclick=()=>{ const p=$('#phone'); (p.requestFullscreen?p.requestFullscreen():Promise.reject()).catch(()=>toast('這個瀏覽器不支援全螢幕')); };
      $('#l-off').onclick=()=>{ st.my.on=false; if(document.fullscreenElement) document.exitFullscreen(); this.cnt(); RW(); this.guest(); };
      return;
    }
    g.innerHTML=`${ghead()}<div class="g-body"><p class="g-lead">選一個顏色，把手機變成燈牌</p>
      <div class="swatches">${LCOL().map(c=>`<button type="button" class="sw ${c===st.my.color?'on':''}" data-c="${c}" style="background:${c}" aria-label="顏色"></button>`).join('')}</div>
      <button type="button" class="btn big block" id="l-on">點亮我的手機</button>
      <p class="hint">點亮後螢幕會跟著大螢幕一起變化，建議把亮度調高</p>
      <p class="hint">已點亮 <b id="lt-n2">${this.lit()}</b> 支</p></div>`;
    $$('#guest .sw').forEach(b=>b.onclick=()=>{ st.my.color=b.dataset.c; $$('#guest .sw').forEach(x=>x.classList.toggle('on',x===b)); sfx('tap'); });
    $('#l-on').onclick=()=>{ st.my.on=true; sfx('win'); vib(40); this.cnt(); this.guest(); RW(); };
  },
  ctrl(){
    return `<div class="panel host span2"><h3>燈海模式 <small>所有手機即時跟著切換</small></h3>
      <div class="seg" id="l-mode">${[['wave','人浪'],['sync','同步呼吸'],['rainbow','彩虹'],['free','自由色']].map(([m,n])=>`<button type="button" data-act="m-${m}" class="${st.mode===m?'on':''}">${n}</button>`).join('')}</div>
      <div class="row"><span class="hint">統一顏色：</span><div class="swatches">${LCOL().map(c=>`<button type="button" class="sw ${c===st.color?'on':''}" data-act="c" data-c="${c}" style="background:${c}"></button>`).join('')}</div></div>
      <div class="trio"><div><div class="big-n" id="cl-n">${this.lit()}</div><small>已點亮</small></div><div><div class="big-n">${st.dots.length+1}</div><small>座位</small></div><div><div class="big-n">${Math.round(this.lit()/(st.dots.length+1)*100)}%</div><small>點亮率</small></div></div></div>
      <div class="panel span2"><h3>大螢幕標語</h3><input type="text" id="l-msg" value="${esc(st.msg)}">
      <div class="row"><button type="button" class="btn small ghost" data-act="all-on">全部點亮（彩排用）</button><button type="button" class="btn small warnb" data-act="all-off">全部熄燈</button></div></div>`;
  },
  ctrlBind(){ $('#l-msg').oninput=e=>{ st.msg=e.target.value; const m=$('.lt-msg'); if(m) m.textContent=st.msg; }; },
  live(){ this.cnt(); },
  act(a, b){
    if(a.startsWith('m-')){ st.mode=a.slice(2); sfx('pop'); toast('燈海切換：'+({wave:'人浪',sync:'同步呼吸',rainbow:'彩虹',free:'自由色'})[st.mode]); }
    if(a==='c'){ st.color=b.dataset.c; }
    if(a==='all-on') st.dots.forEach(d=>d.on=true);
    if(a==='all-off'){ st.dots.forEach(d=>d.on=false); st.my.on=false; }
    if(S.view==='ctrl') renderCtrl(); else hostbar();
    RG(); this.cnt();
  }
};

/* ================================================================
   玩法七：部門挑戰（尾牙）
   ================================================================ */
G.dept = {
  init(){ const D=O().depts; st={phase:'join', lanes:D.map(d=>({...d, v:0, sk:.62+Math.random()*.16, mem:[]})), my:{d:S.me.dept, taps:0}, indiv:{}, cdn:0, win:null, mvp:null, limit:20};
    shuffle(BOTS).slice(0,14).forEach((n,k)=>{ st.lanes[k%4].mem.push(n); st.indiv[n]=0; }); },
  start(){ if(st.phase!=='join') return; st.phase='count'; if(S.view==='ctrl') renderCtrl(); countdown(3, ()=>this.race()); },
  race(){
    st.phase='race'; st.t0=Date.now(); RW(); RG(); if(S.view==='ctrl') renderCtrl();
    every(120, ()=>{ if(st.phase!=='race') return;
      st.lanes.forEach(l=>{ l.v+=l.sk*(.5+Math.random()); l.mem.forEach(m=>{ if(Math.random()<.6) st.indiv[m]++; }); });
      this.upd(); if(st.lanes.some(l=>l.v>=100) || Date.now()-st.t0>st.limit*1000) this.end(); });
  },
  upd(){ st.lanes.forEach((l,i)=>{ const v=Math.min(100,l.v), f=$('#lf'+i), r=$('#lr'+i), t=$('#lt'+i), c=$('#cd'+i);
      if(f) f.style.width=v+'%'; if(r) r.style.left=`calc(${v}% * .92 + 30px)`; if(t) t.textContent=Math.floor(v)+'%'; if(c) c.textContent=Math.floor(v)+'%'; });
    const mp=$('#myp'); if(mp && st.my.d!==null) mp.textContent=Math.floor(Math.min(100,st.lanes[st.my.d].v))+'%'; },
  end(){ st.phase='end'; st.win=[...st.lanes].sort((a,b)=>b.v-a.v)[0]; st.mvp=Object.entries(st.indiv).sort((a,b)=>b[1]-a[1])[0]; sfx('win'); RW(); RG(); if(S.view==='ctrl') renderCtrl(); confetti(); },
  tap(){ if(st.phase!=='race'||st.my.d===null) return; st.lanes[st.my.d].v+=.5; st.my.taps++; st.indiv[S.me.name]=st.my.taps; const m=$('#myt'); if(m) m.textContent=st.my.taps; vib(10); this.upd(); },
  host(){ return st.phase==='join'?`<button class="hb" data-act="start">開始挑戰</button>`:st.phase==='end'?`<button class="hb" data-act="reset">再來一局</button>`:''; },
  wall(el){
    let ov='';
    if(st.phase==='count') ov=`<div class="ov ov-center" style="inset:-124px -44px -30px"><div class="cd-big">${st.cdn}</div></div>`;
    if(st.phase==='end') ov=`<div class="ov ov-center" style="inset:-124px -44px -30px"><div class="ov-kicker">冠 軍 部 門</div><div class="ov-title">${st.win.e} ${esc(st.win.n)}</div><div class="ov-text">個人 MVP：${esc(st.mvp[0])}．狂點 ${st.mvp[1]} 下</div></div>`;
    el.innerHTML=`<div class="race">${st.phase==='join'?'<div class="wait">📱 用手機選擇部門，準備好就開跑！</div>':''}${st.lanes.map((l,i)=>{ const v=Math.min(100,l.v);
      return `<div><div class="ln-h"><span class="ln-e">${l.e}</span><b>${esc(l.n)}</b><small>${l.mem.length+(st.my.d===i?1:0)} 人</small><span class="ln-p" id="lt${i}">${Math.floor(v)}%</span></div>
      <div class="ln-t"><div class="ln-f" id="lf${i}" style="background:${l.c};width:${v}%"></div><div class="ln-r" id="lr${i}" style="left:calc(${v}% * .92 + 30px)">${l.e}</div><div class="ln-flag">🏁</div></div></div>`; }).join('')}</div>${ov}`;
    hostbar();
  },
  guest(){
    const g=$('#guest'), L=st.lanes;
    if(!S.me.name || st.my.d===null){
      g.innerHTML=`${ghead()}<div class="g-body"><p class="g-lead">選你的部門，開始後狂點幫部門衝刺！</p>
        <label class="field">暱稱<input type="text" id="nm" maxlength="10" value="${esc(S.me.name)}" placeholder="例：阿翔"></label>
        <div class="dgrid">${L.map((l,i)=>`<button type="button" class="dbtn" data-i="${i}" style="border-color:${l.c}">${l.e}<b>${esc(l.n)}</b></button>`).join('')}</div></div>`;
      $$('#guest .dbtn').forEach(b=>b.onclick=()=>{ const v=$('#nm').value.trim(); if(!v){ toast('先輸入暱稱喔'); return; } S.me.name=v; S.me.dept=st.my.d=+b.dataset.i; st.indiv[v]=0; sfx('pop'); this.guest(); RW(); }); return;
    }
    const l=L[st.my.d];
    if(st.phase==='join') g.innerHTML=`<div class="g-stage"><div class="big">${l.e}</div><h2>${esc(l.n)}</h2><p class="hint">${esc(S.me.name)}，準備好了嗎？<br>開始後狂點按鈕幫部門衝刺！</p><button type="button" class="link" id="d-chg">換部門</button></div>`;
    else if(st.phase==='count') g.innerHTML=`<div class="g-stage dark"><p>準備</p><div class="big" style="font-size:130px">${st.cdn}</div></div>`;
    else if(st.phase==='race'){
      g.innerHTML=`<div class="g-stage"><div style="display:flex;justify-content:space-between;width:100%;font-weight:700;font-size:18px"><span>${l.e} ${esc(l.n)}</span><span id="myp">0%</span></div>
        <button type="button" class="tap-btn" id="d-tap" style="background:${l.c}">衝！</button><div><span class="big" id="myt" style="font-size:44px">${st.my.taps}</span> 下</div><p class="hint">點越快，部門跑越快</p></div>`;
      const b=$('#d-tap'); b.addEventListener('pointerdown',e=>{ e.preventDefault(); this.tap(); sfx('tap'); b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),70); }); this.upd();
    } else { const w=st.win===l;
      g.innerHTML=`<div class="g-stage full ${w?'ok':'no'}"><div class="big">${w?'🏆':'💪'}</div><h2>${w?'部門拿下冠軍！':'冠軍是'+esc(st.win.n)}</h2><span class="pill">你貢獻了 ${st.my.taps} 下</span><p>MVP：${esc(st.mvp[0])}</p></div>`; }
    if($('#d-chg')) $('#d-chg').onclick=()=>{ st.my.d=S.me.dept=null; this.guest(); RW(); };
  },
  ctrl(){
    const j=st.phase==='join';
    return `<div class="panel host span2"><h3>部門挑戰 <small>${({join:'等待開始',count:'倒數中',race:'進行中',end:'已結束'})[st.phase]}</small></h3>
      <div class="stats">${st.lanes.map((l,i)=>`<div class="stat"><div class="n" id="cd${i}" style="color:${l.c}">${Math.floor(Math.min(100,l.v))}%</div><div class="l">${l.e} ${esc(l.n)}．${l.mem.length+(st.my.d===i?1:0)} 人</div></div>`).join('')}</div>
      <div class="row">${j?`<button type="button" class="btn big" data-act="start">開始挑戰</button>`:st.phase==='end'?`<button type="button" class="btn big" data-act="reset">再來一局</button>`:''}
      <label class="switch">時間上限 <select id="d-lim" ${j?'':'disabled'}>${[15,20,30].map(s=>`<option ${s===st.limit?'selected':''}>${s}</option>`).join('')}</select> 秒</label></div>
      <p class="hint" style="text-align:left">正式版可依部門人數設定平衡係數，人少的部門不吃虧。</p></div>`;
  },
  ctrlBind(){ if($('#d-lim')) $('#d-lim').onchange=e=>st.limit=+e.target.value; },
  act(a){ if(a==='start') this.start(); if(a==='reset') setGame('dept'); }
};

/* ================================================================
   玩法八：搖紅包（尾牙）
   ================================================================ */
const RP = () => O().redpack || KITS.classic.redpack;
const fmtAmt = n => RP().unit==='$' ? '$'+n.toLocaleString() : n.toLocaleString()+' '+RP().unit;
let motionH=null;
function stopMotion(){ if(motionH){ removeEventListener('devicemotion',motionH); motionH=null; } }
function enableMotion(ok){
  const go=()=>{ let last=0, p=null; stopMotion();
    motionH=e=>{ const a=e.accelerationIncludingGravity; if(!a||a.x==null) return; if(!p){ p={x:a.x,y:a.y,z:a.z}; return; }
      const d=Math.abs(a.x-p.x)+Math.abs(a.y-p.y)+Math.abs(a.z-p.z); p={x:a.x,y:a.y,z:a.z}; const n=Date.now();
      if(d>16 && n-last>200){ last=n; if(S.game==='redpack') G.redpack.shake(); } };
    addEventListener('devicemotion',motionH); ok(); };
  if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
    DeviceMotionEvent.requestPermission().then(r=>r==='granted'?go():toast('沒有取得權限，改用點擊紅包也可以')).catch(()=>toast('改用點擊紅包也可以'));
  } else if('ondevicemotion' in window) go(); else { toast('這台裝置偵測不到搖晃，改用點擊'); ok(); }
}
G.redpack = {
  init(){ st={phase:'ready', sh:{}, rate:{}, my:{ready:false, count:0, open:false}, cdn:0, amt:{}, res:[], cfg:RP()};
    shuffle(BOTS).slice(0,14).forEach(n=>{ st.sh[n]=0; st.rate[n]=1.6+Math.random()*2.4; }); },
  start(){ if(st.phase!=='ready') return; st.phase='count'; if(S.view==='ctrl') renderCtrl(); countdown(3, ()=>this.go()); },
  go(){ st.phase='shake'; st.t0=Date.now(); if(S.me.name && st.my.ready) st.sh[S.me.name]=0; RW(); RG(); if(S.view==='ctrl') renderCtrl();
    every(200, ()=>{ if(st.phase!=='shake') return; Object.keys(st.rate).forEach(n=>{ if(Math.random()<st.rate[n]*.2) st.sh[n]++; }); this.upd(); if(Date.now()-st.t0>=st.cfg.sec*1000) this.end(); }); },
  rank(){ return Object.entries(st.sh).map(([name,score])=>({name,score,me:name===S.me.name&&st.my.ready})).sort((a,b)=>b.score-a.score); },
  upd(){
    const r=this.rank(), mx=Math.max(1,r[0]?r[0].score:1), box=$('#rlist');
    if(box){ let list=r.slice(0,8); const mi=r.findIndex(x=>x.me); if(mi>=8) list=[...r.slice(0,7), r[mi]];
      box.innerHTML=list.map(p=>{ const i=r.indexOf(p); return `<div class="rbar ${p.me?'me':''}"><span class="lr-r">${i<3?['🥇','🥈','🥉'][i]:i+1}</span><span class="rbar-n">${esc(p.name)}</span><div class="rbar-t"><div class="rbar-f" style="width:${p.score/mx*100}%"></div></div><b>${p.score}</b></div>`; }).join(''); }
    const t=$('#rtot'); if(t) t.textContent=r.reduce((s,p)=>s+p.score,0);
    const s=$('#rsec'); if(s) s.innerHTML=Math.max(0,Math.ceil(st.cfg.sec-(Date.now()-st.t0)/1000))+'<small>秒</small>';
    const c=$('#cr-tot'); if(c) c.textContent=r.reduce((s,p)=>s+p.score,0);
  },
  end(){ st.phase='end'; const r=this.rank(), cfg=st.cfg; st.amt={};
    r.forEach((p,i)=>st.amt[p.name]= i<3 ? cfg.top[i] : pick(cfg.small)); st.res=r; sfx('win'); RW(); RG(); if(S.view==='ctrl') renderCtrl(); confetti(); },
  shake(){ if(st.phase!=='shake'||!st.my.ready) return; st.my.count++; st.sh[S.me.name]=st.my.count;
    const m=$('#mc'); if(m) m.textContent=st.my.count; const e=$('#env'); if(e){ e.classList.remove('wob'); void e.offsetWidth; e.classList.add('wob'); } vib(25); sfx('coin'); },
  host(){ return st.phase==='ready'?`<button class="hb" data-act="start">開始${esc(gname())}</button>`:st.phase==='end'?`<button class="hb" data-act="reset">再玩一次</button>`:''; },
  wall(el){
    let h=''; const n=Object.keys(st.sh).length+(st.my.ready&&!(S.me.name in st.sh)?1:0);
    if(st.phase==='ready'||st.phase==='count'){
      h=`<div class="rp" style="grid-template-columns:1fr"><div class="rp-l"><div class="rp-big">${RP().emoji}</div><h2>倒數後，全場一起搖手機！</h2><p>搖越多次排名越前面．前三名大${RP().item}，人人都有獎</p><p style="margin-top:14px"><span class="pill" style="font-size:18px">已準備 ${n} 人</span></p></div></div>
        ${st.phase==='count'?`<div class="ov ov-center" style="inset:-124px -44px -30px"><div class="cd-big">${st.cdn}</div></div>`:''}`;
    } else if(st.phase==='shake'){
      h=`<div class="rain">${Array.from({length:22},()=>`<i style="left:${rnd(0,98)}%;animation-duration:${(2.6+Math.random()*2.4).toFixed(2)}s;animation-delay:-${(Math.random()*4).toFixed(2)}s">${RP().emoji}</i>`).join('')}</div>
        <div class="rp"><div class="rp-l"><div class="rp-sec" id="rsec">${st.cfg.sec}<small>秒</small></div><div class="rp-tot">全場已搖 <b id="rtot">0</b> 下</div><h2>用力搖！${RP().emoji}</h2></div>
        <div class="panel-w"><h3>即時排行 <small>搖晃次數</small></h3><div id="rlist"></div></div></div>`;
    } else { const r=st.res;
      h=`<div style="text-align:center"><h2 style="font-family:var(--display);font-weight:var(--dw);font-size:40px;margin:0 0 14px">${RP().emoji} ${RP().king}</h2>
        <div class="rp-top3">${r.slice(0,3).map((p,i)=>`<div class="rk"><div class="rk-m">${['🥇','🥈','🥉'][i]}</div><div class="rk-n">${esc(p.name)}</div><div class="rk-a">${fmtAmt(st.amt[p.name])}</div><div class="rk-c">搖了 ${p.score} 下</div></div>`).join('')}</div>
        <p style="font-size:20px;color:var(--muted);margin-top:24px">其他 ${Math.max(0,r.length-3)} 位也都拿到${RP().item}囉，打開手機看看！</p></div>`;
    }
    el.innerHTML=h; if(st.phase==='shake') this.upd(); hostbar();
  },
  guest(){
    const g=$('#guest');
    if(!S.me.name){ nameForm('🧧',`輸入暱稱，倒數後一起搖手機搶${RP().item}`,'加入',()=>{ this.guest(); RW(); }); return; }
    if(!st.my.ready && st.phase!=='end'){
      g.innerHTML=`<div class="g-stage"><div class="big">📳</div><h2>開啟搖一搖</h2><p class="hint">iPhone 會跳出「動作與方向」權限，請按「允許」</p>
        <button type="button" class="btn big block" id="m-on">啟用搖一搖</button><button type="button" class="link" id="m-tap">我的手機不能搖，改用點擊</button></div>`;
      const ready=()=>{ st.my.ready=true; if(!(S.me.name in st.sh)) st.sh[S.me.name]=0; sfx('pop'); this.guest(); RW(); };
      $('#m-on').onclick=()=>enableMotion(ready); $('#m-tap').onclick=ready; return;
    }
    if(st.phase==='ready') g.innerHTML=`<div class="g-stage"><div class="big">${RP().emoji}</div><h2>準備好了！</h2><p class="hint">${esc(S.me.name)}，看大螢幕倒數<br>開始後用力搖手機（或點${RP().item}）</p></div>`;
    else if(st.phase==='count') g.innerHTML=`<div class="g-stage dark"><p>準備搖</p><div class="big" style="font-size:130px">${st.cdn}</div></div>`;
    else if(st.phase==='shake'){ g.innerHTML=`<div class="g-stage"><p class="hint">搖手機或點${RP().item}</p><div class="env" id="env">${RP().emoji}</div><div><span class="big" id="mc" style="font-size:44px">${st.my.count}</span> 下</div></div>`;
      $('#env').addEventListener('pointerdown',e=>{ e.preventDefault(); this.shake(); }); }
    else { if(!st.my.ready){ g.innerHTML=`<div class="g-stage dark"><div class="big">${RP().emoji}</div><h2>這一輪結束囉</h2><p>下一輪記得先準備好！</p></div>`; return; }
      const r=st.res.findIndex(p=>p.me)+1, a=st.amt[S.me.name];
      if(!st.my.open){ g.innerHTML=`<div class="g-stage"><h2>你的${RP().item}到了！</h2><p class="hint">你搖了 ${st.my.count} 下．第 ${r} 名</p><div class="env" id="env" style="animation:sway 1s infinite alternate">${RP().emoji}</div><p class="hint">點一下打開</p></div>`;
        $('#env').onclick=()=>{ st.my.open=true; sfx('win'); vib(60); this.guest(); }; return; }
      g.innerHTML=`<div class="g-stage"><p class="hint">恭喜 ${esc(S.me.name)}</p><div class="envo"><small>第 ${r} 名．搖了 ${st.my.count} 下</small><b>${fmtAmt(a)}</b><small>${r<=3?'大'+RP().item+'！請上台領獎':'新年快樂、好運滿滿'}</small></div><p class="trust">金額為示範，可設定為實際獎金、抽獎券或兌換品</p></div>`; }
  },
  ctrl(){
    const c=st.cfg, rd=st.phase==='ready';
    return `<div class="panel host span2"><h3>${esc(gname())} <small>${({ready:'等待開始',count:'倒數中',shake:'搖晃中',end:'已開獎'})[st.phase]}</small></h3>
      <div class="trio"><div><div class="big-n">${Object.keys(st.sh).length}</div><small>參加人數</small></div><div><div class="big-n" id="cr-tot">0</div><small>總搖晃次數</small></div><div><div class="big-n">${c.sec}s</div><small>倒數</small></div></div>
      <div class="row">${rd?`<button type="button" class="btn big" data-act="start">開始${esc(gname())}</button>`:st.phase==='end'?`<button type="button" class="btn big" data-act="reset">再玩一次</button>`:''}</div></div>
      <div class="panel span2"><h3>獎項設定 <small>單位：${esc(RP().unit)}．開始前可修改</small></h3><div class="form-grid">
        ${c.top.map((v,i)=>`<label>第 ${i+1} 名<input type="number" min="0" data-top="${i}" value="${v}" ${rd?'':'disabled'}></label>`).join('')}
        <label>倒數秒數<input type="number" min="5" max="60" id="r-sec" value="${c.sec}" ${rd?'':'disabled'}></label>
        <label class="full">其他人隨機小紅包（用逗號分隔）<input type="text" id="r-small" value="${c.small.join(',')}" ${rd?'':'disabled'}></label></div></div>`;
  },
  ctrlBind(){
    $$('#ctrl [data-top]').forEach(i=>i.onchange=()=>st.cfg.top[+i.dataset.top]=Math.max(0,+i.value||0));
    if($('#r-sec')) $('#r-sec').onchange=e=>st.cfg.sec=Math.min(60,Math.max(5,+e.target.value||15));
    if($('#r-small')) $('#r-small').onchange=e=>{ const v=e.target.value.split(/[,，\s]+/).map(Number).filter(n=>n>0); if(v.length) st.cfg.small=v; };
    this.upd();
  },
  act(a){ if(a==='start') this.start(); if(a==='reset') setGame('redpack'); }
};

/* ========== 啟動 ========== */
$('#view-seg').onclick=e=>{ const b=e.target.closest('button'); if(b) setView(b.dataset.view); };
$('#occ-tabs').onclick=e=>{ const b=e.target.closest('.occ-tab'); if(!b || b.dataset.occ===S.occ) return; setOcc(b.dataset.occ); setGame(S.lastGame[S.occ]||O().games[0][0]); sfx('pop'); };
$('#game-select').onchange=e=>setGame(e.target.value);
$('#tpl-select').onchange=e=>setTpl(e.target.value);
$('#snd').onclick=()=>{ S.sound=!S.sound; $('#snd').textContent=S.sound?'🔊':'🔇'; if(S.sound) sfx('pop'); };
$('#st1').addEventListener('click', actHandler);
$('#ctrl').addEventListener('click', actHandler);
document.addEventListener('change', e=>{ if(e.target.hasAttribute('data-auto')){ S.auto=e.target.checked; if(S.auto && S.game==='quiz' && (st.phase==='reveal'||st.phase==='board')) G.quiz.autoNext(2500); } });
$('#w-full').onclick=()=>{ const w=$('#wall'); (w.requestFullscreen?w.requestFullscreen():Promise.reject()).catch(()=>toast('這個瀏覽器不支援全螢幕')); };
if(!document.documentElement.requestFullscreen) $('#w-full').hidden=true;
new ResizeObserver(fit).observe($('#wall')); addEventListener('resize',fit); document.addEventListener('fullscreenchange',fit);
(function loop(t){ if(G[S.game] && G[S.game].frame) G[S.game].frame(t); requestAnimationFrame(loop); })(performance.now());

(function boot(){
  const q=new URLSearchParams(location.search);
  const occ=q.get('occ')==='weiya'||q.get('t')==='weiya'?'weiya':'wedding', tpl=q.get('tpl')||q.get('kit');
  if(WED_TPLS.some(x=>x[0]===tpl)) S.wtpl=tpl; if(KITS[tpl]) S.kit=tpl;
  setOcc(occ); setGame(q.get('game')||O().games[0][0]);
  preloadStickers();
  const v=q.get('view'); if(['guest','wall','ctrl'].includes(v)) setView(v);
})();
</script>
